<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Create Account | ShrimpGuard</title>
	<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="login-page">
{% include "_icon_sprite.html" %}
<main class="login-shell">
	<section class="login-panel" aria-labelledby="signup-title">
		<div class="login-brand">
			<span class="login-brand-mark" aria-hidden="true"><svg class="ui-icon brand-icon"><use href="#icon-shrimp"></use></svg></span>
			<span>ShrimpGuard</span>
		</div>

		<p class="eyebrow">Get started</p>
		<h1 id="signup-title">Create account</h1>
		<p class="login-intro">Create an account to access ShrimpGuard.</p>

		{% if error %}
		<div class="login-error" role="alert">{{ error }}</div>
		{% endif %}

		<form class="login-form" method="post" action="{{ url_for('signup') }}">
			<input type="hidden" name="csrf_token" value="{{ session['signup_csrf_token'] }}">

			<label for="user-name">Username</label>
			<input id="user-name" name="user_name" type="text" autocomplete="username" maxlength="80" placeholder="Markiplier" required autofocus>

			<label for="email">Email</label>
			<input id="email" name="email" type="email" autocomplete="email" maxlength="255" placeholder="markiplier@gmail.com" required>

			<label for="password">Password</label>
			<input id="password" name="password" type="password" autocomplete="new-password" minlength="8" placeholder="••••••••" required>

			<label for="confirm-password">Confirm password</label>
			<input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" placeholder="••••••••" required>

			<button type="submit">Create account</button>
		</form>
		<p class="login-signup-link">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
	</section>
</main>
</body>
</html>
